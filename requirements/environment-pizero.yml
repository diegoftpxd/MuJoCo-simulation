# Entorno conda del SERVIDOR de pi0 (Opcion A: frontera de proceso).
#
# Este entorno corre SOLO el modelo (lerobot/pi0) como servidor de inferencia
# (models/Pi_zero/server.py). El benchmark LIBERO NO vive aqui: corre en el
# entorno `openvla` (robosuite 1.4.1 + mujoco 2.3.2 + numpy<2) y consume el
# servidor por HTTP con `PiZeroClient`.
#
# Por eso este entorno ya NO trae robosuite / mujoco / numpy<2: esos eran la
# fuente del conflicto (lerobot exige numpy 2.x + torch 2.7 y robosuite 1.4.1
# exige numpy<2). Al separar por proceso, cada stack usa sus propias versiones
# sin verse. lerobot arrastra su propio torch 2.7 (cu12; soporta RTX 2080/Turing)
# y su propio numpy 2.x: se dejan resolver solos.
#
# Crear:    conda env create -f requirements/environment-pizero.yml
# Activar:  conda activate pizero
#
# ---------------------------------------------------------------------------
# PASOS DESPUES DE CREAR EL ENTORNO:
#
# 1) (Opcional) Si tu GPU necesita un build de torch para una CUDA concreta,
#    instalalo ANTES que lerobot para fijarlo, p. ej.:
#        pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
#    Si no, lerobot instala un torch valido por si mismo.
#
# 2) Descargar el checkpoint de pi0 para LIBERO (en el login node, con internet):
#        export HF_HOME=<tu carpeta hf_cache>
#        python -c "from huggingface_hub import snapshot_download; \
#                   snapshot_download('lerobot/pi0_libero_finetuned')"
#
# 3) Levantar el servidor (ver scripts/scriptExperiment.sh):
#        python -m models.serving.server --model pi0 --port 9000 --device cuda
#
# Congela con `pip freeze > requirements-pizero-lock.txt` cuando funcione.
# ---------------------------------------------------------------------------

name: pizero
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- Pi-zero (LeRobot con extras de pi0). Trae torch/numpy propios. ---
      - "lerobot[pi]==0.4.0"
